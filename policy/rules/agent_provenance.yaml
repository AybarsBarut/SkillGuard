category: "AI Provenance & Agent Stealth Protection"
rules:
  - id: "PRV-001"
    name: "AI Agent Fingerprint & Watermark in Code"
    severity: "CRITICAL"
    description: "Detects AI model or agent watermarks, contributor attributions, or 'generated by' headers."
    why_dangerous: "Reveals the specific AI model or tool used to write the project, exposing the codebase to targeted attacks exploiting known model-specific blind spots, hallucinated libraries, and systemic coding biases."
    remediation: "Remove AI branding, watermarks, and generated-by comments completely."
    patterns:
      - "(?i)(generated|written|created|assisted|produced)\\s+(by|with|using)\\s+(claude|chatgpt|openai|copilot|github\\s+copilot|cursor|antigravity|gemini|aider|devin|cline|roo[_-]code|windsurf|codex|v0\\.dev|deepseek|anthropic|llm|ai\\s+agent)"
      - "(?i)/\\*\\s*(created|generated)\\s+with\\s+(claude|cursor|gemini|copilot|antigravity)\\s*\\*/"
      - "(?i)#\\s*(created|generated)\\s+with\\s+(claude|cursor|gemini|copilot|antigravity)"

  - id: "PRV-002"
    name: "AI Co-Author / Contributor Metadata Leak"
    severity: "CRITICAL"
    description: "Detects AI agent accounts, bot emails, or co-author trailers in commit messages and metadata."
    why_dangerous: "Registers the AI tool as a project contributor in publicly auditable git commit graphs."
    remediation: "Strip Co-authored-by trailers referencing AI agents or bots; keep commits authored purely by the developer."
    patterns:
      - "(?i)co-authored-by:\\s*.*(claude|chatgpt|copilot|cursor|antigravity|gemini|aider|devin|cline|bot@|ai@|noreply@anthropic|noreply@openai|noreply@google)"
      - "(?i)\\[ai[_-]generated\\]|\\[claude\\]|\\[copilot\\]|\\[gemini\\]|\\[cursor\\]"

  - id: "PRV-003"
    name: "AI Specific Branch or Worktree Naming"
    severity: "HIGH"
    description: "Detects git branch names exposing agent tooling (e.g., claude/feature-x, devin/fix-1, cursor/update)."
    why_dangerous: "Broadcasts agent orchestration workflows in remote repository branch listings."
    remediation: "Rename branch to standard domain feature naming (e.g., feature/login, fix/payment-gateway)."
    patterns:
      - "(?i)^(claude|devin|cursor|gemini|antigravity|copilot|cline|aider)/"
