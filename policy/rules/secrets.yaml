category: "Secrets & Sensitive Credential Signatures"
rules:
  - id: "SEC-001"
    name: "Amazon Web Services (AWS) Access Key"
    severity: "CRITICAL"
    description: "Detects AWS Access Key ID formats (e.g., AKIA...)."
    why_dangerous: "Grants unauthenticated cloud infrastructure access leading to data compromise and resource hijacking."
    remediation: "Revoke key in AWS IAM immediately, remove from repository, and rotate credentials."
    patterns:
      - "(?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}"

  - id: "SEC-002"
    name: "GitHub Personal Access or OAuth Token"
    severity: "CRITICAL"
    description: "Detects GitHub PATs, fine-grained tokens, and app tokens (ghp_, github_pat_)."
    why_dangerous: "Allows unauthorized access, commits, and exfiltration across private repositories."
    remediation: "Revoke token on GitHub immediately and purge git history if committed."
    patterns:
      - "\\bghp_[a-zA-Z0-9]{36}\\b"
      - "\\bgithub_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59}\\b"
      - "\\bgho_[a-zA-Z0-9]{36}\\b"

  - id: "SEC-003"
    name: "OpenAI / Anthropic API Key"
    severity: "CRITICAL"
    description: "Detects OpenAI (sk-...) and Anthropic (sk-ant-...) production API secret keys."
    why_dangerous: "Enables financial theft via unauthorized model consumption and data access."
    remediation: "Rotate API key via provider dashboard and move secret to environment variables."
    patterns:
      - "\\bsk-[a-zA-Z0-9]{20,48}\\b"
      - "\\bsk-ant-api[a-zA-Z0-9_\\-]{30,80}\\b"

  - id: "SEC-004"
    name: "Stripe Live Secret or Restricted Key"
    severity: "CRITICAL"
    description: "Detects Stripe live secret keys (sk_live_, rk_live_)."
    why_dangerous: "Allows attackers to make unauthorized charges, view customer data, and initiate refunds."
    remediation: "Roll key immediately in Stripe Developer Dashboard."
    patterns:
      - "\\b[sr]k_live_[0-9a-zA-Z]{24,99}\\b"

  - id: "SEC-005"
    name: "Private Cryptographic Key Block"
    severity: "CRITICAL"
    description: "Detects PEM format private keys (RSA, OPENSSH, EC, PGP)."
    why_dangerous: "Allows decrypting server traffic, signing malicious commits, or compromising SSH access."
    remediation: "Revoke SSH/TLS keys and delete key files from source control."
    patterns:
      - "-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"

  - id: "SEC-006"
    name: "Database Connection String With Embedded Password"
    severity: "HIGH"
    description: "Detects database URI schemes containing inline credentials (user:password@host)."
    why_dangerous: "Exposes database passwords and host coordinates in plain text."
    remediation: "Extract database credentials to environment variables (.env)."
    patterns:
      - "(?i)(postgres|postgresql|mysql|mongodb|redis)://[^\\s:@]+:[^\\s:@]+@[^\\s:@]+:\\d+/[^\\s\"']+"
